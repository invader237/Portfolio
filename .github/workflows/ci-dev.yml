name: CI DEV - Build & Push Docker Image

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/invader237/portfolio-diego/portfolio-diego-dev:${{ steps.vars.outputs.sha_short }} .

      - name: Push Docker image
        run: |
          docker push ghcr.io/invader237/portfolio-diego/portfolio-diego-dev:${{ steps.vars.outputs.sha_short }}
