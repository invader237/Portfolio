name: Build & Deploy

on:
  push:
    branches:
      - dev
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: d-portfolio-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug context
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "ENV: $ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: front
          file: front/Dockerfile.${{ env.ENV }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-${{ env.ENV }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest

    if: ${{ github.ref_name == 'dev' || github.ref_name == 'main' }}

    permissions:
      contents: read
      packages: read

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    env:
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.sha_short }}
      REGISTRY: ghcr.io
      IMAGE_NAME: d-portfolio-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug context
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "ENV: $ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-$ENV:$IMAGE_TAG
          echo "Checking image: $IMAGE"
          docker manifest inspect $IMAGE > /dev/null || (echo "Image not found" && exit 1)

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > kubeconfig
          chmod 600 kubeconfig

      - name: Deploy to Kubernetes
        run: |
          export KUBECONFIG=$PWD/kubeconfig

          NAMESPACE=d-portfolio-$ENV
          DEPLOYMENT=portfolio-frontend-$ENV

          IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-$ENV:$IMAGE_TAG

          echo "Deploying to namespace: $NAMESPACE"
          echo "Using deployment: $DEPLOYMENT"
          echo "Using image: $IMAGE"

          if ! kubectl get namespace $NAMESPACE > /dev/null 2>&1; then
            echo "Namespace $NAMESPACE does not exist"
            exit 1
          fi

          kubectl -n $NAMESPACE set image deployment/$DEPLOYMENT frontend=$IMAGE

          kubectl -n $NAMESPACE rollout status deployment/$DEPLOYMENT --timeout=180s
