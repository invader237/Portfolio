name: Build & Deploy

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    permissions:
      contents: read
      packages: write

    env:
      ENV: ${{ github.env }}
      REGISTRY: ghcr.io
      IMAGE_NAME: d-portfolio-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -f front/Dockerfile.$ENV \
            -t $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME-$ENV:${{ steps.vars.outputs.sha_short }} \
            front

      - name: Push Docker image
        run: |
          docker push $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME-$ENV:${{ steps.vars.outputs.sha_short }}

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    environment:
      name: development

    env:
      ENV: ${{ github.env }}
      REGISTRY: ghcr.io
      IMAGE_NAME: portfolio-diego
      IMAGE_TAG: ${{ needs.build-and-push.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > kubeconfig

      - name: Deploy to Kubernetes
        run: |
          export KUBECONFIG=$PWD/kubeconfig

          NAMESPACE=d-portfolio-$ENV
          IMAGE=$REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME-$ENV:$IMAGE_TAG

          echo "Deploying to namespace: $NAMESPACE"
          echo "Using image: $IMAGE"

          kubectl get namespace $NAMESPACE || exit 1

          kubectl -n $NAMESPACE set image deployment/frontend frontend=$IMAGE

          kubectl -n $NAMESPACE rollout status deployment/frontend
